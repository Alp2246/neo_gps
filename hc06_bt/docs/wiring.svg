<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="360" fill="#0d1117"/>
  <text x="280" y="30" fill="#58a6ff" text-anchor="middle" font-size="17" font-weight="bold">PYNQ-Z2 + HC-06 Bluetooth (9960)</text>
  <text x="280" y="52" fill="#8b949e" text-anchor="middle" font-size="12">GPS ile ayni UART pinleri  ayni anda tek overlay</text>

  <rect x="24" y="70" width="200" height="260" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="124" y="98" fill="#e6edf3" text-anchor="middle" font-size="14" font-weight="bold">PYNQ-Z2</text>
  <text x="124" y="118" fill="#8b949e" text-anchor="middle" font-size="11">RPi Header</text>

  <rect x="336" y="90" width="200" height="220" rx="10" fill="#161b22" stroke="#238636" stroke-width="2"/>
  <text x="436" y="118" fill="#3fb950" text-anchor="middle" font-size="14" font-weight="bold">HC-06</text>
  <rect x="376" y="132" width="120" height="56" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="436" y="165" fill="#8b949e" text-anchor="middle" font-size="12">BT SPP 9600</text>
  <circle cx="476" cy="210" r="6" fill="#3fb950"/>
  <text x="436" y="235" fill="#8b949e" text-anchor="middle" font-size="10">LED (guc)</text>

  <line x1="224" y1="130" x2="336" y2="140" stroke="#f85149" stroke-width="3"/>
  <line x1="224" y1="170" x2="336" y2="180" stroke="#8b949e" stroke-width="3"/>
  <line x1="224" y1="210" x2="336" y2="220" stroke="#58a6ff" stroke-width="3"/>
  <line x1="224" y1="250" x2="336" y2="260" stroke="#d29922" stroke-width="3"/>

  <text x="36" y="135" fill="#f85149" font-size="12">Pin 1  3.3V</text>
  <text x="36" y="175" fill="#8b949e" font-size="12">Pin 6  GND</text>
  <text x="36" y="215" fill="#58a6ff" font-size="12">Pin 10  FPGA RX</text>
  <text x="36" y="255" fill="#d29922" font-size="12">Pin 8  FPGA TX</text>

  <text x="346" y="145" fill="#f85149" font-size="11">VCC</text>
  <text x="346" y="185" fill="#8b949e" font-size="11">GND</text>
  <text x="346" y="225" fill="#58a6ff" font-size="11">TXD (modul TX)</text>
  <text x="346" y="265" fill="#d29922" font-size="11">RXD (modul RX)</text>

  <text x="280" y="310" fill="#8b949e" text-anchor="middle" font-size="11">TXD modulden cikar í Pin 10 | RXD module girer ê Pin 8</text>
  <text x="280" y="330" fill="#6e7681" text-anchor="middle" font-size="10">DOUT degil TXD/DIN kullan | Calismazsa Pin 8 ve 10 degistir</text>
  <text x="280" y="348" fill="#6e7681" text-anchor="middle" font-size="10">Bitstream: gps_uart.bin @ 0x42C00000  9600 baud</text>
</svg>
